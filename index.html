<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>CTRL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #FAFAF8;
    color: #1C1C1A;
    min-height: 100vh;
    font-size: 13px;
  }

  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: #1C1C1A;
  }
  .login-box {
    background: #FAFAF8; border-radius: 12px; padding: 40px;
    width: 340px; text-align: center;
  }
  .login-box h1 { font-family: 'Lora', serif; font-size: 20px; font-weight: 500; margin-bottom: 6px; }
  .login-box p { color: #999; font-size: 13px; margin-bottom: 24px; }
  .login-box input {
    width: 100%; padding: 10px 14px; border: 0.5px solid #E0DDD6;
    border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none;
    background: white; font-family: 'Inter', sans-serif;
  }
  .login-box input:focus { border-color: #4C3D8F; }
  .login-box button {
    width: 100%; padding: 10px; background: #4C3D8F; color: white;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .login-box button:hover { background: #3D3075; }
  .login-error { color: #E24B4A; font-size: 12px; margin-top: 8px; }

  #app { display: none; }

  header {
    background: #1C1C1A; color: white;
    padding: 12px 24px;
    display: flex; flex-direction: row; align-items: center; gap: 28px;
  }

  .logo-mark {
    display: flex; flex-direction: row; align-items: center;
    gap: 9px; text-decoration: none; flex-shrink: 0;
  }
  .logo-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .logo-text {
    font-family: 'Lora', serif; font-size: 14px; font-weight: 500;
    letter-spacing: 0.5px; color: white;
  }

  .top-nav { display: flex; flex-direction: row; gap: 0; }
  .top-nav a {
    font-family: 'Lora', serif; font-size: 13px; font-weight: 500;
    padding: 4px 14px 4px 0; text-decoration: none;
    color: rgba(255,255,255,0.38); transition: color 0.15s;
  }
  .top-nav a:hover { color: rgba(255,255,255,0.7); }
  .top-nav .nav-active { color: rgba(255,255,255,0.9); }

  header .meta { font-size: 11px; color: rgba(255,255,255,0.3); margin-left: auto; white-space: nowrap; }

  .toolbar {
    padding: 16px 24px 12px;
    display: flex; gap: 8px; align-items: center;
  }

  .btn {
    padding: 7px 14px; border-radius: 7px; border: 0.5px solid #E0DDD6;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: all 0.15s;
    background: white; color: #555;
  }
  .btn:hover { border-color: #C5C0B8; background: #F5F4F0; }
  .btn-primary { background: #4C3D8F; color: white; border-color: #4C3D8F; }
  .btn-primary:hover { background: #3D3075; border-color: #3D3075; }
  .btn-ghost { background: transparent; border-color: transparent; color: #999; }
  .btn-ghost:hover { background: #F0EFEB; color: #555; border-color: transparent; }

  .board {
    display: flex; flex-direction: row; gap: 14px;
    padding: 4px 24px 24px; overflow-x: auto; align-items: flex-start;
  }

  .column { min-width: 250px; width: 250px; flex-shrink: 0; }

  .column-header {
    display: flex; flex-direction: row;
    justify-content: space-between; align-items: center;
    padding: 0 2px 8px;
  }
  .col-name {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.7px; color: #B0ADA6;
  }
  .col-count { font-size: 11px; color: #C8C5BE; font-weight: 400; }

  .col-rule { height: 1.5px; background: #ECEAE4; border-radius: 2px; margin-bottom: 10px; }

  .col-today .col-name { color: #4C3D8F; }
  .col-today .col-count { color: #9B8FCC; }
  .col-today .col-rule { background: #4C3D8F; }
  .col-doing .col-name { color: #4A6FA5; }
  .col-doing .col-rule { background: #4A6FA5; opacity: 0.4; }
  .col-blocked .col-name { color: #B85A5A; }
  .col-blocked .col-rule { background: #E24B4A; opacity: 0.3; }
  .col-done .col-name { color: #C0BDB6; }
  .col-done .col-rule { background: #E0DDD6; }

  .column-body { min-height: 40px; }

  .task-card {
    background: white; border: 0.5px solid #E8E5DF;
    border-radius: 10px; padding: 12px 14px; margin-bottom: 7px;
    cursor: grab; transition: border-color 0.15s;
  }
  .task-card:hover { border-color: #CCC9C2; }
  .task-card:active { cursor: grabbing; }
  .task-card.dragging { opacity: 0.35; }
  .col-done .task-card { opacity: 0.5; }

  .task-title {
    font-family: 'Lora', Georgia, serif;
    font-size: 14px; font-weight: 500; color: #1C1C1A;
    line-height: 1.45; margin-bottom: 9px;
  }

  .task-meta {
    display: flex; flex-direction: row; gap: 5px;
    flex-wrap: wrap; align-items: center;
  }

  .priority-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .priority-dot.high { background: #E24B4A; }
  .priority-dot.medium { background: #EF9F27; }
  .priority-dot.low { background: #97C459; }

  .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 20px;
    font-weight: 400; font-family: 'Inter', sans-serif;
  }
  .tag-duration { background: #F0EDF8; color: #6B5DB8; }
  .tag-due { background: #FEF6EA; color: #A07020; }
  .tag-label { background: #F4F3F0; color: #888; }
  .tag-overdue { background: #FDEEED; color: #A32D2D; }
  .tag-scheduled-on { background: #F0EDF8; color: #6B5DB8; }
  .tag-status-updated { background: #F4F3F0; color: #B0ADA6; font-size: 10px; }
  .tag-recurring { background: #EDF6F0; color: #3B6D11; }

  .column-body.drag-over {
    background: #F0EDF8; border-radius: 8px;
    outline: 1.5px dashed #9B8FCC; min-height: 60px;
  }
  .empty-col { text-align: center; color: #D8D5CE; font-size: 12px; padding: 16px 0; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(28,28,26,0.4); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #FAFAF8; border-radius: 12px; width: 480px;
    max-width: 95vw; max-height: 90vh; overflow-y: auto;
    border: 0.5px solid #E0DDD6;
  }
  .modal-header {
    padding: 20px 24px 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 { font-family: 'Lora', serif; font-size: 15px; font-weight: 500; }
  .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #B0ADA6; }
  .modal-body { padding: 18px 24px 24px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 5px; color: #B0ADA6;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 12px; border: 0.5px solid #E0DDD6;
    border-radius: 7px; font-size: 13px; outline: none;
    font-family: 'Inter', sans-serif; background: white; color: #1C1C1A;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #4C3D8F; }
  .field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 18px; padding-top: 16px; border-top: 0.5px solid #ECEAE4;
  }
  .btn-danger { background: #FDEEED; color: #A32D2D; border-color: #F5C5C5; }
  .btn-danger:hover { background: #FAD5D5; }

  .status-bar {
    padding: 6px 24px; font-size: 11px; color: #B0ADA6;
    background: #F4F3F0; border-top: 0.5px solid #ECEAE4;
  }
  .version-bar {
    padding: 4px 24px; font-size: 10px; color: #D0CEC8;
    background: #F4F3F0; text-align: right;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>⌨️ CTRL</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="pwd-input" placeholder="Password" />
    <button onclick="tryLogin()">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <a href="index.html" class="logo-mark">
      <svg class="logo-icon" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="9.5" stroke="white" stroke-width="1.5" opacity="0.85"/>
        <circle cx="11" cy="11" r="3.5" fill="white" opacity="0.9"/>
        <circle cx="16.5" cy="5.5" r="2" fill="#6B5DB8"/>
      </svg>
      <span class="logo-text">CTRL</span>
    </a>
    <nav class="top-nav">
      <a href="index.html" class="nav-active">Board</a>
      <a href="plans.html" class="nav-link">Plans</a>
      <a href="calendar.html" class="nav-link">Calendar</a>
    </nav>
    <span class="meta" id="last-sync">Loading...</span>
  </header>

<div class="toolbar">
    <button class="btn btn-primary" onclick="openModal()">+ New Task</button>
    <button class="btn btn-ghost" onclick="loadTasks()">↻ Refresh</button>
  </div>

  <div class="board">
    <div class="column col-backlog">
      <div class="column-header"><span class="col-name">Backlog</span><span class="col-count" id="count-backlog">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-backlog"></div>
    </div>
    <div class="column col-scheduled">
      <div class="column-header"><span class="col-name">Scheduled</span><span class="col-count" id="count-scheduled">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-scheduled"></div>
    </div>
    <div class="column col-today">
      <div class="column-header"><span class="col-name">Today</span><span class="col-count" id="count-today">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-today"></div>
    </div>
    <div class="column col-doing">
      <div class="column-header"><span class="col-name">In Progress</span><span class="col-count" id="count-doing">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-doing"></div>
    </div>
    <div class="column col-blocked">
      <div class="column-header"><span class="col-name">Blocked</span><span class="col-count" id="count-blocked">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-blocked"></div>
    </div>
    <div class="column col-done">
      <div class="column-header"><span class="col-name">Done</span><span class="col-count" id="count-done">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-done"></div>
    </div>
  </div>

  </div>

  <div class="status-bar" id="status-bar">Ready</div>
  <div class="version-bar">CTRL v2.3 — deployed 2026-07-03 13:00 UTC</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">New Task</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="task-id" />
      <div class="field">
        <label>Title</label>
        <input type="text" id="task-title" placeholder="What needs doing?" />
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="task-notes" placeholder="Optional details..."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Status</label>
          <select id="task-status">
            <option value="backlog" selected>Backlog</option>
            <option value="scheduled">Scheduled</option>
            <option value="today">Today</option>
            <option value="doing">In Progress</option>
            <option value="blocked">Blocked</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="field">
          <label>Duration (mins)</label>
          <input type="number" id="task-duration" placeholder="e.g. 45" min="0" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Due Date</label>
          <input type="date" id="task-due" />
        </div>
        <div class="field">
          <label>Scheduled On</label>
          <input type="date" id="task-scheduled-on" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Label</label>
          <select id="task-label-select" onchange="onLabelSelectChange(this.value)">
            <option value="">— Select a label —</option>
          </select>
          <input type="text" id="task-label-new" placeholder="Type new label name..." 
            style="display:none; margin-top:6px; width:100%; padding:9px 12px; border:1.5px solid #4f46e5; border-radius:7px; font-size:14px; outline:none; font-family:inherit;" />
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="task-priority">
            <option value="">None</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; font-size:13px;">
          <input type="checkbox" id="task-recurring" style="width:16px; height:16px; cursor:pointer;" />
          Recurring weekly task
        </label>
        <div style="font-size:12px; color:#aaa; margin-top:4px;">When marked Done, a new copy is automatically scheduled for next week.</div>
      </div>
      <div id="task-meta-info" style="display:none; margin-top:16px; padding-top:12px; border-top:1px solid #e5e7eb;">
        <div style="font-size:11px; color:#aaa;" id="task-updated-display"></div>
        <div style="font-size:11px; color:#aaa;" id="task-status-updated-display"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="btn-delete" onclick="deleteTask()" style="display:none">Delete</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
      </div>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'timemanager2026';
const TASKS_URL = '/api/data?type=tasks';
const SAVE_TASK_URL = '/api/data?type=tasks';
const LABELS_URL = '/api/data?type=labels';

let tasks = [];

// --- AUTH ---
function tryLogin() {
  const val = document.getElementById('pwd-input').value;
  if (val === PASSWORD) {
    localStorage.setItem('tm_auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadLabels();
    loadTasks();
  } else {
    document.getElementById('login-error').textContent = 'Incorrect password.';
  }
}

document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

if (localStorage.getItem('tm_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadLabels();
  loadTasks();
}

// --- DATA ---
let labels = [];

async function loadLabels() {
  try {
    const res = await fetch(LABELS_URL);
    const data = await res.json();
    labels = data.labels || [];
    populateLabelSelect();
  } catch(e) {
    console.warn('Could not load labels:', e);
  }
}

function populateLabelSelect(selected) {
  const sel = document.getElementById('task-label-select');
  if (!sel) return;
  sel.innerHTML = '<option value="">— Select a label —</option>' +
    labels.map(l => `<option value="${l}" ${l === selected ? 'selected' : ''}>${l}</option>`).join('') +
    '<option value="__new__">+ New label...</option>';
  sel.value = selected || '';
  document.getElementById('task-label-new').style.display = 'none';
  document.getElementById('task-label-new').value = '';
}

function onLabelSelectChange(val) {
  const newInput = document.getElementById('task-label-new');
  if (val === '__new__') {
    newInput.style.display = 'block';
    newInput.focus();
  } else {
    newInput.style.display = 'none';
    newInput.value = '';
  }
}

function getSelectedLabel() {
  const sel = document.getElementById('task-label-select');
  const newInput = document.getElementById('task-label-new');
  if (sel.value === '__new__') return newInput.value.trim() || null;
  return sel.value || null;
}

async function loadTasks() {
  setStatus('Loading...');
  try {
    const res = await fetch(TASKS_URL);
    const data = await res.json();
    tasks = data.tasks || [];

    // Auto-move scheduled tasks for today into Today column
    const today = new Date().toISOString().slice(0, 10);
    const toMove = tasks.filter(t => t.status === 'scheduled' && t.scheduled_on === today);
    for (const t of toMove) {
      t.status = 'today';
      await fetch(SAVE_TASK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...t, status: 'today' })
      });
    }

    renderBoard();
    document.getElementById('last-sync').textContent = 'Synced ' + new Date().toLocaleTimeString();
    setStatus(`${tasks.length} task${tasks.length !== 1 ? 's' : ''} loaded${toMove.length ? ` — ${toMove.length} moved to Today` : ''}`);
  } catch(e) {
    setStatus('Error loading tasks: ' + e.message);
  }
}

async function saveTaskToDb(task) {
  const res = await fetch(SAVE_TASK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(task)
  });
  return res.json();
}

async function deleteTaskFromDb(id) {
  const res = await fetch(SAVE_TASK_URL, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  return res.json();
}

// --- RENDER ---
function renderBoard() {
  const cols = { backlog: [], scheduled: [], today: [], doing: [], blocked: [], done: [] };
  tasks.forEach(t => { const s = t.status || 'backlog'; if (cols[s]) cols[s].push(t); else cols['backlog'].push(t); });

  Object.entries(cols).forEach(([status, items]) => {
    const el = document.getElementById('col-' + status);
    const count = document.getElementById('count-' + status);
    count.textContent = items.length;
    if (items.length === 0) {
      el.innerHTML = '<div class="empty-col">No tasks</div>';
    } else {
      el.innerHTML = items.map(t => `
        <div class="task-card" draggable="true" data-id="${t.id}">
          <div class="task-title">${escHtml(t.title)}</div>
          <div class="task-meta">
            ${t.priority ? `<span class="priority-dot ${t.priority.toLowerCase()}" title="${t.priority}"></span>` : ''}
            ${t.duration ? `<span class="tag tag-duration">${t.duration}m</span>` : ''}
            ${t.label ? `<span class="tag tag-label">${escHtml(t.label)}</span>` : ''}
            ${t.scheduled_on && t.status !== 'today' ? `<span class="tag tag-scheduled-on">${t.scheduled_on}</span>` : ''}
            ${t.due && t.due !== t.scheduled_on ? `<span class="tag ${isOverdue(t) ? 'tag-overdue' : 'tag-due'}">${t.due}</span>` : ''}
            ${t.recurring ? `<span class="tag tag-recurring">↻</span>` : ''}
          </div>
        </div>
      `).join('');html>

</style>

<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>⌨️ CTRL</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="pwd-input" placeholder="Password" />
    <button onclick="tryLogin()">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <a href="index.html" class="logo-mark">
      <svg class="logo-icon" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="9.5" stroke="white" stroke-width="1.5" opacity="0.85"/>
        <circle cx="11" cy="11" r="3.5" fill="white" opacity="0.9"/>
        <circle cx="16.5" cy="5.5" r="2" fill="#6B5DB8"/>
      </svg>
      <span class="logo-text">CTRL</span>
    </a>
    <nav class="top-nav">
      <a href="index.html" class="nav-active">Board</a>
      <a href="plans.html" class="nav-link">Plans</a>
      <a href="calendar.html" class="nav-link">Calendar</a>
    </nav>
    <span class="meta" id="last-sync">Loading...</span>
  </header>

<div class="toolbar">
    <button class="btn btn-primary" onclick="openModal()">+ New Task</button>
    <button class="btn btn-ghost" onclick="loadTasks()">↻ Refresh</button>
  </div>

  <div class="board">
    <div class="column col-backlog">
      <div class="column-header"><span class="col-name">Backlog</span><span class="col-count" id="count-backlog">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-backlog"></div>
    </div>
    <div class="column col-scheduled">
      <div class="column-header"><span class="col-name">Scheduled</span><span class="col-count" id="count-scheduled">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-scheduled"></div>
    </div>
    <div class="column col-today">
      <div class="column-header"><span class="col-name">Today</span><span class="col-count" id="count-today">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-today"></div>
    </div>
    <div class="column col-doing">
      <div class="column-header"><span class="col-name">In Progress</span><span class="col-count" id="count-doing">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-doing"></div>
    </div>
    <div class="column col-blocked">
      <div class="column-header"><span class="col-name">Blocked</span><span class="col-count" id="count-blocked">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-blocked"></div>
    </div>
    <div class="column col-done">
      <div class="column-header"><span class="col-name">Done</span><span class="col-count" id="count-done">0</span></div>
      <div class="col-rule"></div>
      <div class="column-body" id="col-done"></div>
    </div>
  </div>

  </div>

  <div class="status-bar" id="status-bar">Ready</div>
  <div class="version-bar">CTRL v2.3 — deployed 2026-07-03 13:00 UTC</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">New Task</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="task-id" />
      <div class="field">
        <label>Title</label>
        <input type="text" id="task-title" placeholder="What needs doing?" />
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="task-notes" placeholder="Optional details..."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Status</label>
          <select id="task-status">
            <option value="backlog" selected>Backlog</option>
            <option value="scheduled">Scheduled</option>
            <option value="today">Today</option>
            <option value="doing">In Progress</option>
            <option value="blocked">Blocked</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="field">
          <label>Duration (mins)</label>
          <input type="number" id="task-duration" placeholder="e.g. 45" min="0" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Due Date</label>
          <input type="date" id="task-due" />
        </div>
        <div class="field">
          <label>Scheduled On</label>
          <input type="date" id="task-scheduled-on" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Label</label>
          <select id="task-label-select" onchange="onLabelSelectChange(this.value)">
            <option value="">— Select a label —</option>
          </select>
          <input type="text" id="task-label-new" placeholder="Type new label name..." 
            style="display:none; margin-top:6px; width:100%; padding:9px 12px; border:1.5px solid #4f46e5; border-radius:7px; font-size:14px; outline:none; font-family:inherit;" />
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="task-priority">
            <option value="">None</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; font-size:13px;">
          <input type="checkbox" id="task-recurring" style="width:16px; height:16px; cursor:pointer;" />
          Recurring weekly task
        </label>
        <div style="font-size:12px; color:#aaa; margin-top:4px;">When marked Done, a new copy is automatically scheduled for next week.</div>
      </div>
      <div id="task-meta-info" style="display:none; margin-top:16px; padding-top:12px; border-top:1px solid #e5e7eb;">
        <div style="font-size:11px; color:#aaa;" id="task-updated-display"></div>
        <div style="font-size:11px; color:#aaa;" id="task-status-updated-display"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="btn-delete" onclick="deleteTask()" style="display:none">Delete</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
      </div>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'timemanager2026';
const TASKS_URL = '/api/data?type=tasks';
const SAVE_TASK_URL = '/api/data?type=tasks';
const LABELS_URL = '/api/data?type=labels';

let tasks = [];

// --- AUTH ---
function tryLogin() {
  const val = document.getElementById('pwd-input').value;
  if (val === PASSWORD) {
    localStorage.setItem('tm_auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadLabels();
    loadTasks();
  } else {
    document.getElementById('login-error').textContent = 'Incorrect password.';
  }
}

document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

if (localStorage.getItem('tm_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadLabels();
  loadTasks();
}

// --- DATA ---
let labels = [];

async function loadLabels() {
  try {
    const res = await fetch(LABELS_URL);
    const data = await res.json();
    labels = data.labels || [];
    populateLabelSelect();
  } catch(e) {
    console.warn('Could not load labels:', e);
  }
}

function populateLabelSelect(selected) {
  const sel = document.getElementById('task-label-select');
  if (!sel) return;
  sel.innerHTML = '<option value="">— Select a label —</option>' +
    labels.map(l => `<option value="${l}" ${l === selected ? 'selected' : ''}>${l}</option>`).join('') +
    '<option value="__new__">+ New label...</option>';
  sel.value = selected || '';
  document.getElementById('task-label-new').style.display = 'none';
  document.getElementById('task-label-new').value = '';
}

function onLabelSelectChange(val) {
  const newInput = document.getElementById('task-label-new');
  if (val === '__new__') {
    newInput.style.display = 'block';
    newInput.focus();
  } else {
    newInput.style.display = 'none';
    newInput.value = '';
  }
}

function getSelectedLabel() {
  const sel = document.getElementById('task-label-select');
  const newInput = document.getElementById('task-label-new');
  if (sel.value === '__new__') return newInput.value.trim() || null;
  return sel.value || null;
}

async function loadTasks() {
  setStatus('Loading...');
  try {
    const res = await fetch(TASKS_URL);
    const data = await res.json();
    tasks = data.tasks || [];

    // Auto-move scheduled tasks for today into Today column
    const today = new Date().toISOString().slice(0, 10);
    const toMove = tasks.filter(t => t.status === 'scheduled' && t.scheduled_on === today);
    for (const t of toMove) {
      t.status = 'today';
      await fetch(SAVE_TASK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...t, status: 'today' })
      });
    }

    renderBoard();
    document.getElementById('last-sync').textContent = 'Synced ' + new Date().toLocaleTimeString();
    setStatus(`${tasks.length} task${tasks.length !== 1 ? 's' : ''} loaded${toMove.length ? ` — ${toMove.length} moved to Today` : ''}`);
  } catch(e) {
    setStatus('Error loading tasks: ' + e.message);
  }
}

async function saveTaskToDb(task) {
  const res = await fetch(SAVE_TASK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(task)
  });
  return res.json();
}

async function deleteTaskFromDb(id) {
  const res = await fetch(SAVE_TASK_URL, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  return res.json();
}

// --- RENDER ---
function renderBoard() {
  const cols = { backlog: [], scheduled: [], today: [], doing: [], blocked: [], done: [] };
  tasks.forEach(t => { const s = t.status || 'backlog'; if (cols[s]) cols[s].push(t); else cols['backlog'].push(t); });

  Object.entries(cols).forEach(([status, items]) => {
    const el = document.getElementById('col-' + status);
    const count = document.getElementById('count-' + status);
    count.textContent = items.length;
    if (items.length === 0) {
      el.innerHTML = '<div class="empty-col">No tasks</div>';
    } else {
      el.innerHTML = items.map(t => `
        <div class="task-card" draggable="true" data-id="${t.id}" onclick="handleCardClick(event, '${t.id}')">
          <div class="task-title">${escHtml(t.title)}</div>
          <div class="task-meta">
            ${t.duration ? `<span class="tag tag-duration">⏱ ${t.duration}m</span>` : ''}
            ${t.scheduled_on ? `<span class="tag tag-scheduled-on">📅 ${t.scheduled_on}</span>` : ''}
            ${t.due && t.due !== t.scheduled_on ? `<span class="tag ${isOverdue(t) ? 'tag-overdue' : 'tag-due'}">🏁 ${t.due}</span>` : ''}
            ${t.label ? `<span class="tag tag-label">${escHtml(t.label)}</span>` : ''}
          </div>
        </div>
      `).join('');
    }

    // Drag events on column body
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', async e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if (!id) return;
      const task = tasks.find(t => t.id === id);
      if (!task || task.status === status) return;
      task.status = status;
      task.updated = new Date().toISOString();
      renderBoard();
      setStatus('Saving...');
      const result = await saveTaskToDb(task);
      if (result.recurring_clone_id) {
        const clone = cloneRecurring(task);
        clone.id = result.recurring_clone_id;
        clone.scheduled_on = result.recurring_scheduled_on;
        tasks.push(clone);
        renderBoard();
        setStatus(`"${task.title}" done — next copy scheduled for ${clone.scheduled_on}`);
      } else {
        setStatus('Saved ✓');
      }
    });
  });

  // Drag start on cards (must happen after innerHTML is set)
  document.querySelectorAll('.task-card[draggable]').forEach(card => {
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', card.dataset.id);
      setTimeout(() => card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
}

function isOverdue(t) {
  if (!t.due || t.status === 'done') return false;
  return new Date(t.due) < new Date();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Distinguish click vs drag
let dragMoved = false;
function handleCardClick(e, id) {
  if (dragMoved) { dragMoved = false; return; }
  openModal(id);
}
document.addEventListener('dragstart', () => { dragMoved = false; });
document.addEventListener('dragend', e => { if (e.dataTransfer.dropEffect !== 'none') dragMoved = true; });

// --- RECURRING ---
function cloneRecurring(task) {
  const base = task.scheduled_on || new Date().toISOString().slice(0, 10);
  const next = new Date(base + 'T12:00:00');
  next.setDate(next.getDate() + 7);
  const nextDate = next.toISOString().slice(0, 10);
  return {
    ...task,
    id: crypto.randomUUID(),
    status: 'scheduled',
    scheduled_on: nextDate,
    due: task.due ? nextDate : null,
    created: new Date().toISOString(),
    updated: new Date().toISOString(),
    status_updated: new Date().toISOString()
  };
}

// --- MODAL ---
function openModal(id) {
  const task = id ? tasks.find(t => t.id === id) : null;
  document.getElementById('modal-title').textContent = task ? 'Edit Task' : 'New Task';
  document.getElementById('task-id').value = task ? task.id : '';
  document.getElementById('task-title').value = task ? task.title : '';
  document.getElementById('task-notes').value = task ? (task.notes || '') : '';
  document.getElementById('task-status').value = task ? task.status : 'backlog';
  document.getElementById('task-duration').value = task ? (task.duration || '') : '';
  document.getElementById('task-scheduled-on').value = task ? (task.scheduled_on || '') : '';
  document.getElementById('task-due').value = task ? (task.due || '') : '';
  const taskLabel = task ? (task.label || '') : '';
  document.getElementById('task-priority').value = task ? (task.priority || '') : '';
  document.getElementById('task-recurring').checked = task ? (task.recurring || false) : false;
  populateLabelSelect(taskLabel);
  document.getElementById('task-label-new').style.display = 'none';
  // Show meta info for existing tasks
  const metaDiv = document.getElementById('task-meta-info');
  const updatedDiv = document.getElementById('task-updated-display');
  const statusUpdatedDiv = document.getElementById('task-status-updated-display');
  if (task) {
    metaDiv.style.display = 'block';
    updatedDiv.textContent = task.updated ? 'Last updated: ' + new Date(task.updated).toLocaleString('en-GB') : '';
    statusUpdatedDiv.textContent = task.status_updated ? 'Status changed: ' + new Date(task.status_updated).toLocaleString('en-GB') : '';
  } else {
    metaDiv.style.display = 'none';
  }
  document.getElementById('btn-delete').style.display = task ? 'block' : 'none';
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('task-title').focus();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

async function saveTask() {
  const id = document.getElementById('task-id').value;
  const title = document.getElementById('task-title').value.trim();
  if (!title) { alert('Title is required.'); return; }

  const task = {
    id: id || crypto.randomUUID(),
    title,
    notes: document.getElementById('task-notes').value.trim(),
    status: document.getElementById('task-status').value,
    duration: parseInt(document.getElementById('task-duration').value) || null,
    scheduled_on: document.getElementById('task-scheduled-on').value || null,
    due: document.getElementById('task-due').value || null,
    label: getSelectedLabel(),
    recurring: document.getElementById('task-recurring').checked || false,
    priority: document.getElementById('task-priority').value || null,
    created: id ? (tasks.find(t => t.id === id)?.created || new Date().toISOString()) : new Date().toISOString(),
    updated: new Date().toISOString(),
    status_updated: (() => {
      if (!id) return new Date().toISOString();
      const prev = tasks.find(t => t.id === id);
      return (prev && prev.status !== document.getElementById('task-status').value)
        ? new Date().toISOString()
        : (prev?.status_updated || new Date().toISOString());
    })()
  };

  if (id) {
    tasks = tasks.map(t => t.id === id ? task : t);
  } else {
    tasks.push(task);
  }


  renderBoard();
  closeModal();
  setStatus('Saving...');
  const saveResult = await saveTaskToDb(task);
  if (saveResult && saveResult.ok) {
    setStatus('Saved ✓');
  } else {
    setStatus('Save error: ' + (saveResult?.error || 'Unknown'));
    console.error('Save failed:', saveResult);
  }
  // Add new label to database if needed
  const chosenLabel = getSelectedLabel();
  if (chosenLabel && !labels.includes(chosenLabel)) {
    labels.push(chosenLabel);
    labels.sort();
    fetch(LABELS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label: chosenLabel })
    });
  }
}

async function deleteTask() {
  const id = document.getElementById('task-id').value;
  const task = tasks.find(t => t.id === id);
  if (!task || !confirm(`Delete "${task.title}"?`)) return;
  tasks = tasks.filter(t => t.id !== id);
  renderBoard();
  closeModal();
  setStatus('Deleting...');
  await deleteTaskFromDb(id);
  setStatus('Deleted ✓');
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}
</script>
