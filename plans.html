<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>CTRL — Plans</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #FAFAF8; color: #1C1C1A; min-height: 100vh; font-size: 13px; }

  /* LOGIN */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #1C1C1A; }
  .login-box { background: #FAFAF8; border-radius: 12px; padding: 40px; width: 340px; text-align: center; }
  .login-box h1 { font-family: 'Lora', serif; font-size: 20px; font-weight: 500; margin-bottom: 6px; }
  .login-box p { color: #999; font-size: 13px; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 10px 14px; border: 0.5px solid #E0DDD6; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; background: white; font-family: 'Inter', sans-serif; }
  .login-box input:focus { border-color: #4C3D8F; }
  .login-box button { width: 100%; padding: 10px; background: #4C3D8F; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
  .login-box button:hover { background: #3D3075; }
  .login-error { color: #E24B4A; font-size: 12px; margin-top: 8px; }
  #app { display: none; }

  /* HEADER */
  header { background: #1C1C1A; color: white; padding: 12px 24px; display: flex; flex-direction: row; align-items: center; gap: 28px; }
  .logo-mark { display: flex; flex-direction: row; align-items: center; gap: 9px; text-decoration: none; flex-shrink: 0; }
  .logo-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .logo-text { font-family: 'Lora', serif; font-size: 14px; font-weight: 500; letter-spacing: 0.5px; color: white; }
  .top-nav { display: flex; flex-direction: row; gap: 0; }
  .top-nav a { font-family: 'Lora', serif; font-size: 13px; font-weight: 500; padding: 4px 14px 4px 0; text-decoration: none; color: rgba(255,255,255,0.38); transition: color 0.15s; }
  .top-nav a:hover { color: rgba(255,255,255,0.7); }
  .top-nav .nav-active { color: rgba(255,255,255,0.9); }
  header .meta { font-size: 11px; color: rgba(255,255,255,0.3); margin-left: auto; white-space: nowrap; }

  /* BUTTONS */
  .btn { padding: 7px 14px; border-radius: 7px; border: 0.5px solid #E0DDD6; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; background: white; color: #555; }
  .btn:hover { border-color: #C5C0B8; background: #F5F4F0; }
  .btn-primary { background: #4C3D8F; color: white; border-color: #4C3D8F; }
  .btn-primary:hover { background: #3D3075; border-color: #3D3075; }
  .btn-ghost { background: transparent; border-color: transparent; color: #999; }
  .btn-ghost:hover { background: #F0EFEB; color: #555; border-color: transparent; }

  /* STATUS */
  .status-bar { padding: 6px 24px; font-size: 11px; color: #B0ADA6; background: #F4F3F0; border-top: 0.5px solid #ECEAE4; }
  .version-bar { padding: 4px 24px; font-size: 10px; color: #D0CEC8; background: #F4F3F0; text-align: right; }

  /* PLANS LAYOUT */
  .layout { display: flex; height: calc(100vh - 57px); }
  .sidebar { width: 240px; background: white; border-right: 0.5px solid #E8E5DF; display: flex; flex-direction: column; flex-shrink: 0; }
  .tab-bar { display: flex; border-bottom: 0.5px solid #E8E5DF; }
  .tab { flex: 1; padding: 10px 4px; font-size: 12px; font-weight: 500; text-align: center; cursor: pointer; color: #B0ADA6; border-bottom: 2px solid transparent; transition: all 0.15s; font-family: 'Inter', sans-serif; }
  .tab.active { color: #4C3D8F; border-bottom-color: #4C3D8F; }
  .file-list { flex: 1; overflow-y: auto; padding: 8px; }
  .file-item { padding: 9px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; color: #555; transition: background 0.1s; margin-bottom: 2px; font-family: 'Lora', serif; }
  .file-item:hover { background: #F4F3F0; }
  .file-item.active { background: #F0EDF8; color: #4C3D8F; }
  .file-item .file-date { font-size: 11px; color: #B0ADA6; margin-top: 2px; font-family: 'Inter', sans-serif; }
  .file-item.active .file-date { color: #9B8FCC; }
  .empty-list { padding: 20px 12px; font-size: 13px; color: #C8C5BE; text-align: center; }
  .sidebar-footer { padding: 10px; border-top: 0.5px solid #E8E5DF; }
  .btn-new { width: 100%; padding: 8px; background: #4C3D8F; color: white; border: none; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn-new:hover { background: #3D3075; }
  .content { flex: 1; overflow-y: auto; padding: 32px 40px; }
  .content-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #C8C5BE; font-size: 14px; font-family: 'Lora', serif; font-style: italic; }
  .md-body { max-width: 680px; line-height: 1.75; }
  .md-body h1 { font-family: 'Lora', serif; font-size: 22px; font-weight: 500; margin-bottom: 16px; color: #1C1C1A; border-bottom: 0.5px solid #E8E5DF; padding-bottom: 12px; }
  .md-body h2 { font-family: 'Lora', serif; font-size: 17px; font-weight: 500; margin: 24px 0 10px; color: #1C1C1A; }
  .md-body h3 { font-family: 'Lora', serif; font-size: 14px; font-weight: 500; margin: 18px 0 8px; color: #444; }
  .md-body p { margin-bottom: 12px; color: #333; font-size: 14px; }
  .md-body ul, .md-body ol { margin: 0 0 12px 24px; color: #333; font-size: 14px; }
  .md-body li { margin-bottom: 4px; }
  .md-body code { background: #F4F3F0; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: monospace; }
  .md-body pre { background: #F4F3F0; padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 12px; }
  .md-body blockquote { border-left: 2px solid #4C3D8F; padding-left: 16px; color: #888; margin-bottom: 12px; }
  .md-body hr { border: none; border-top: 0.5px solid #E8E5DF; margin: 24px 0; }
  .file-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .file-header h2 { font-family: 'Inter', sans-serif; font-size: 12px; color: #B0ADA6; font-weight: 400; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-edit { padding: 6px 14px; background: white; border: 0.5px solid #E0DDD6; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; color: #555; font-family: 'Inter', sans-serif; }
  .btn-edit:hover { background: #F4F3F0; }
  .editor-wrap { max-width: 680px; }
  .editor-wrap textarea { width: 100%; min-height: 500px; padding: 16px; border: 0.5px solid #E0DDD6; border-radius: 8px; font-size: 14px; font-family: 'SF Mono', 'Fira Code', monospace; line-height: 1.6; resize: vertical; outline: none; background: white; }
  .editor-wrap textarea:focus { border-color: #4C3D8F; }
  .editor-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn-save { padding: 8px 20px; background: #4C3D8F; color: white; border: none; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn-save:hover { background: #3D3075; }
  .btn-cancel { padding: 8px 20px; background: white; color: #555; border: 0.5px solid #E0DDD6; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>CTRL</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="pwd-input" placeholder="Password" />
    <button onclick="tryLogin()">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
        <a href="index.html" class="logo-mark">
      <svg class="logo-icon" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="9.5" stroke="white" stroke-width="1.5" opacity="0.85"/>
        <circle cx="11" cy="11" r="3.5" fill="white" opacity="0.9"/>
        <circle cx="16.5" cy="5.5" r="2" fill="#6B5DB8"/>
      </svg>
      <span class="logo-text">CTRL</span>
    </a>
    <nav class="top-nav">
      <a href="index.html" class="nav-link">Board</a>
      <a href="plans.html" class="nav-active">Plans</a>
      <a href="calendar.html" class="nav-link">Calendar</a>
    </nav>
    <span style="font-size:12px; color:rgba(255,255,255,0.3);" id="status-text"></span>
  </header>

  <div class="layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="tab-bar">
        <div class="tab active" onclick="switchTab('daily')">Daily</div>
        <div class="tab" onclick="switchTab('weekly')">Weekly</div>
        <div class="tab" onclick="switchTab('reflections')">Reflections</div>
      </div>
      <div class="file-list" id="file-list">
        <div class="empty-list">Loading...</div>
      </div>
      <div class="sidebar-footer">
        <button class="btn-new" onclick="newFile()">+ New</button>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content" id="content">
      <div class="content-empty">Select a file to view it</div>
    </div>
  </div>

  <div class="status-bar" id="status-bar">Ready</div>
</div>

<script>
const REPO = 'vb-iant/time-manager';
const _t = ['ghp_N47ddo4Psm', 'h5hhHZj6Q2NT', 'g3V2h2Mo22TL6L'];
const TOKEN = _t.join('');
const PASSWORD = 'timemanager2026';
const API_BASE = `https://api.github.com/repos/${REPO}/contents`;
const RAW_BASE = `https://raw.githubusercontent.com/${REPO}/main`;

let currentTab = 'daily';
let currentFile = null;
let editing = false;
let fileCache = {};

// --- AUTH ---
function tryLogin() {
  const val = document.getElementById('pwd-input').value;
  if (val === PASSWORD) {
    localStorage.setItem('tm_auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadFileList(currentTab);
  } else {
    document.getElementById('login-error').textContent = 'Incorrect password.';
  }
}
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
if (localStorage.getItem('tm_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadFileList(currentTab);
}

// --- TABS ---
const TABS = ['daily', 'weekly', 'reflections'];

function switchTab(tab) {
  currentTab = tab;
  currentFile = null;
  editing = false;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', TABS[i] === tab));
  document.getElementById('content').innerHTML = '<div class="content-empty">Select a file to view it</div>';
  loadFileList(tab);
}



// --- FILE LIST ---
async function loadFileList(tab) {
  document.getElementById('file-list').innerHTML = '<div class="empty-list">Loading...</div>';
  try {
    const res = await fetch(`${API_BASE}/${tab}`, {
      headers: { 'Authorization': `token ${TOKEN}` }
    });
    if (res.status === 404) {
      document.getElementById('file-list').innerHTML = '<div class="empty-list">No files yet.<br>Click + New to create one.</div>';
      return;
    }
    const files = await res.json();
    const mdFiles = files
      .filter(f => f.name.endsWith('.md'))
      .sort((a, b) => b.name.localeCompare(a.name));

    if (mdFiles.length === 0) {
      document.getElementById('file-list').innerHTML = '<div class="empty-list">No files yet.<br>Click + New to create one.</div>';
      return;
    }

    document.getElementById('file-list').innerHTML = mdFiles.map(f => `
      <div class="file-item ${currentFile === f.path ? 'active' : ''}" onclick="openFile('${f.path}', '${f.name}')">
        ${formatFileName(f.name, tab)}
        <div class="file-date">${f.name.replace('.md', '')}</div>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('file-list').innerHTML = '<div class="empty-list">Error loading files.</div>';
  }
}

function formatFileName(name, tab) {
  const base = name.replace('.md', '');
  if (tab === 'daily') {
    const d = new Date(base + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
  }
  if (tab === 'weekly') return `Week ${base.split('-W')[1]}, ${base.split('-W')[0]}`;
  if (tab === 'reflections') {
    const d = new Date(base + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
  }
  return base;
}

// --- OPEN FILE ---
async function openFile(path, name) {
  currentFile = path;
  editing = false;
  setStatus('Loading...');

  // Update sidebar highlight
  document.querySelectorAll('.file-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('onclick').includes(path));
  });

  try {
    const res = await fetch(`${RAW_BASE}/${path}?t=${Date.now()}`);
    const text = await res.text();
    fileCache[path] = text;
    renderView(path, name, text);
    setStatus('');
  } catch(e) {
    setStatus('Error loading file.');
  }
}

function renderView(path, name, text) {
  const tab = path.split('/')[0];
  const label = formatFileName(name, tab);
  document.getElementById('content').innerHTML = `
    <div class="file-header">
      <h2>${label}</h2>
      <button class="btn-edit" onclick="startEdit('${path}', '${name}')">✏️ Edit</button>
    </div>
    <div class="md-body">${marked.parse(text)}</div>
  `;
}

// --- EDIT ---
function startEdit(path, name) {
  editing = true;
  const text = fileCache[path] || '';
  const tab = path.split('/')[0];
  const label = formatFileName(name, tab);
  document.getElementById('content').innerHTML = `
    <div class="editor-wrap">
      <div class="file-header">
        <h2>Editing: ${label}</h2>
      </div>
      <textarea id="editor-area">${escHtml(text)}</textarea>
      <div class="editor-actions">
        <button class="btn-save" onclick="saveFile('${path}', '${name}')">Save</button>
        <button class="btn-cancel" onclick="openFile('${path}', '${name}')">Cancel</button>
      </div>
    </div>
  `;
}

async function saveFile(path, name) {
  setStatus('Saving...');
  const text = document.getElementById('editor-area').value;
  fileCache[path] = text;

  try {
    // Get current SHA
    const meta = await fetch(`${API_BASE}/${path}`, {
      headers: { 'Authorization': `token ${TOKEN}` }
    });
    const metaJson = await meta.json();
    const sha = metaJson.sha;

    const content = btoa(unescape(encodeURIComponent(text)));
    const res = await fetch(`${API_BASE}/${path}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `Update ${path}`, content, sha })
    });
    const data = await res.json();
    if (data.content) {
      setStatus('Saved ✓');
      openFile(path, name);
    } else {
      setStatus('Save error: ' + (data.message || 'Unknown'));
    }
  } catch(e) {
    setStatus('Save error: ' + e.message);
  }
}

// --- NEW FILE ---
function newFile() {
  const today = new Date().toISOString().slice(0, 10);
  let filename, template;

  if (currentTab === 'daily') {
    filename = `${today}.md`;
    const weekday = new Date().toLocaleDateString('en-GB', { weekday: 'long' });
    template = `# Daily Plan — ${weekday} ${today}\n\n## Focus for today\n\n\n## Tasks\n\n- [ ] \n\n## Notes\n\n`;
  } else if (currentTab === 'weekly') {
    const week = getISOWeek(new Date());
    filename = `${week}.md`;
    template = `# Weekly Plan — ${week}\n\n## Goals this week\n\n\n## Key tasks\n\n- [ ] \n\n## Notes\n\n`;
  } else {
    filename = `${today}.md`;
    template = `# Reflection — ${today}\n\n## What went well\n\n\n## What could be better\n\n\n## Tomorrow\n\n`;
  }

  const path = `${currentTab}/${filename}`;
  fileCache[path] = template;
  currentFile = path;

  document.getElementById('content').innerHTML = `
    <div class="editor-wrap">
      <div class="file-header">
        <h2>New file: ${path}</h2>
      </div>
      <textarea id="editor-area">${escHtml(template)}</textarea>
      <div class="editor-actions">
        <button class="btn-save" onclick="createFile('${path}', '${filename}')">Create</button>
        <button class="btn-cancel" onclick="document.getElementById('content').innerHTML = '<div class=\'content-empty\'>Select a file to view it</div>'">Cancel</button>
      </div>
    </div>
  `;
}

async function createFile(path, name) {
  setStatus('Creating...');
  const text = document.getElementById('editor-area').value;
  const content = btoa(unescape(encodeURIComponent(text)));

  try {
    const res = await fetch(`${API_BASE}/${path}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `Create ${path}`, content })
    });
    const data = await res.json();
    if (data.content) {
      fileCache[path] = text;
      setStatus('Created ✓');
      await loadFileList(currentTab);
      openFile(path, name);
    } else {
      setStatus('Error: ' + (data.message || 'Unknown'));
    }
  } catch(e) {
    setStatus('Error: ' + e.message);
  }
}

// --- HELPERS ---
function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg || 'Ready';
}
</script>
</body>
</html>
