<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>CTRL — Calendar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

  /* LOGIN */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #1a1a2e; }
  .login-box { background: white; border-radius: 12px; padding: 40px; width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .login-box h1 { font-size: 22px; margin-bottom: 6px; }
  .login-box p { color: #888; font-size: 13px; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; margin-bottom: 12px; outline: none; }
  .login-box input:focus { border-color: #4f46e5; }
  .login-box button { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .login-error { color: #e53e3e; font-size: 13px; margin-top: 8px; }

  /* APP */
  #app { display: none; }

  header { background: #1a1a2e; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 600; }
  .top-nav { display: flex; gap: 6px; }
  .top-nav a { font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 6px; text-decoration: none; color: rgba(255,255,255,0.7); transition: all 0.15s; }
  .top-nav a:hover { background: rgba(255,255,255,0.15); color: white; }
  .top-nav .nav-active { background: rgba(255,255,255,0.2); color: white; }

  /* WEEK NAV */
  .week-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: white; border-bottom: 1px solid #e5e7eb; }
  .week-nav h2 { font-size: 16px; font-weight: 700; }
  .week-nav-buttons { display: flex; gap: 8px; align-items: center; }
  .btn { padding: 7px 14px; border-radius: 7px; border: 1px solid #ddd; background: white; font-size: 13px; font-weight: 600; cursor: pointer; color: #555; transition: all 0.15s; }
  .btn:hover { background: #f5f5f5; }
  .btn-today { background: #4f46e5; color: white; border-color: #4f46e5; }
  .btn-today:hover { background: #4338ca; }

  /* CALENDAR GRID */
  .calendar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 20px 24px; align-items: start; }

  .day-col { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; }
  .day-col.today { box-shadow: 0 0 0 2px #4f46e5, 0 1px 4px rgba(0,0,0,0.08); }

  .day-header { padding: 12px 14px 10px; border-bottom: 1px solid #f0f0f0; }
  .day-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; }
  .day-date { font-size: 22px; font-weight: 700; color: #1a1a2e; line-height: 1.2; }
  .day-col.today .day-name { color: #4f46e5; }
  .day-col.today .day-date { color: #4f46e5; }
  .day-duration { font-size: 11px; color: #aaa; margin-top: 2px; }
  .day-duration.heavy { color: #dc2626; font-weight: 600; }

  .day-tasks { padding: 10px; min-height: 60px; }

  .cal-task { border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; border-left: 3px solid transparent; }
  .cal-task:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
  .cal-task-title { font-size: 12px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; }
  .cal-task-meta { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .cal-tag { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 500; }

  .empty-day { text-align: center; color: #ddd; font-size: 12px; padding: 16px 0; }

  /* LABEL COLOURS */
  .label-bd       { background: #dbeafe; border-left-color: #3b82f6; }
  .label-admin    { background: #f3f4f6; border-left-color: #9ca3af; }
  .label-podcast  { background: #ede9fe; border-left-color: #8b5cf6; }
  .label-client   { background: #d1fae5; border-left-color: #10b981; }
  .label-vb       { background: #fef3c7; border-left-color: #f59e0b; }
  .label-personal { background: #fee2e2; border-left-color: #ef4444; }
  .label-dev      { background: #e0f2fe; border-left-color: #0ea5e9; }
  .label-default  { background: #f9fafb; border-left-color: #e5e7eb; }

  .priority-high   { background: #fee2e2; color: #991b1b; }
  .priority-medium { background: #fef3c7; color: #92400e; }
  .priority-low    { background: #f0fdf4; color: #166534; }

  .status-bar { padding: 8px 24px; font-size: 12px; color: #888; background: white; border-top: 1px solid #e5e7eb; }

  /* MODAL (reused from board) */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 12px; width: 480px; max-width: 95vw; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .modal .meta { font-size: 12px; color: #888; margin-bottom: 16px; }
  .modal .detail { font-size: 13px; color: #444; margin-bottom: 8px; }
  .modal .detail span { font-weight: 600; color: #1a1a2e; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-primary { background: #4f46e5; color: white; border: none; border-radius: 7px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-ghost { background: white; color: #555; border: 1px solid #ddd; border-radius: 7px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>⌨️ CTRL</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="pwd-input" placeholder="Password" />
    <button onclick="tryLogin()">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <h1>⌨️ CTRL</h1>
    <nav class="top-nav">
      <a href="index.html" class="nav-link">📋 Board</a>
      <a href="plans.html" class="nav-link">📝 Plans</a>
      <a href="calendar.html" class="nav-active">📅 Calendar</a>
    </nav>
    <span style="font-size:12px; color:#888;" id="sync-time"></span>
  </header>

  <div class="week-nav">
    <div class="week-nav-buttons">
      <button class="btn" onclick="prevWeek()">← Prev</button>
      <button class="btn btn-today" onclick="goToday()">Today</button>
      <button class="btn" onclick="nextWeek()">Next →</button>
    </div>
    <h2 id="week-label">Week of ...</h2>
    <button class="btn" onclick="loadTasks()">↻ Refresh</button>
  </div>

  <div class="calendar" id="calendar"></div>
  <div class="status-bar" id="status-bar">Loading...</div>
</div>

<!-- TASK DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <div class="meta" id="modal-meta"></div>
    <div class="detail" id="modal-notes"></div>
    <div class="detail" id="modal-duration"></div>
    <div class="detail" id="modal-priority"></div>
    <div class="detail" id="modal-status"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn-primary" onclick="goBoard()">Open in Board</button>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'timemanager2026';
const RAW_URL = '/api/tasks';

let tasks = [];
let weekOffset = 0;

// --- AUTH ---
function tryLogin() {
  const val = document.getElementById('pwd-input').value;
  if (val === PASSWORD) {
    localStorage.setItem('tm_auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadTasks();
  } else {
    document.getElementById('login-error').textContent = 'Incorrect password.';
  }
}
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
if (localStorage.getItem('tm_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadTasks();
}

// --- DATA ---
async function loadTasks() {
  setStatus('Loading...');
  try {
    const res = await fetch(RAW_URL);
    const data = await res.json();
    tasks = Array.isArray(data) ? data : (data.tasks || []);
    renderCalendar();
    document.getElementById('sync-time').textContent = 'Synced ' + new Date().toLocaleTimeString();
    setStatus(`${tasks.length} tasks loaded`);
  } catch(e) {
    setStatus('Error loading tasks: ' + e.message);
  }
}

// --- WEEK ---
function getWeekDays(offset) {
  const today = new Date();
  const day = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1) + (offset * 7));
  const days = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d);
  }
  return days;
}

function prevWeek() { weekOffset--; renderCalendar(); }
function nextWeek() { weekOffset++; renderCalendar(); }
function goToday() { weekOffset = 0; renderCalendar(); }

// --- LABEL COLOUR ---
function labelClass(label) {
  if (!label) return 'label-default';
  const l = label.toLowerCase();
  if (l.includes('business') || l.includes('bd')) return 'label-bd';
  if (l.includes('admin')) return 'label-admin';
  if (l.includes('podcast')) return 'label-podcast';
  if (l.includes('client')) return 'label-client';
  if (l.includes('vb content') || l.includes('velocity')) return 'label-vb';
  if (l.includes('personal')) return 'label-personal';
  if (l.includes('dev')) return 'label-dev';
  return 'label-default';
}

// --- RENDER ---
function renderCalendar() {
  const days = getWeekDays(weekOffset);
  const todayStr = new Date().toISOString().slice(0, 10);

  // Week label
  const from = days[0].toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const to = days[5].toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  document.getElementById('week-label').textContent = `${from} – ${to}`;

  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  days.forEach(day => {
    const dateStr = day.toISOString().slice(0, 10);
    const isToday = dateStr === todayStr;

    // Get tasks for this day — scheduled_on matches, not done
    const dayTasks = tasks.filter(t =>
      t.scheduled_on === dateStr && t.status !== 'done'
    );

    // Total duration
    const totalMins = dayTasks.reduce((sum, t) => sum + (t.duration || 0), 0);
    const durationStr = totalMins > 0
      ? totalMins >= 60
        ? `${Math.floor(totalMins/60)}h ${totalMins%60 > 0 ? totalMins%60 + 'm' : ''}`.trim()
        : `${totalMins}m`
      : '';

    const col = document.createElement('div');
    col.className = `day-col${isToday ? ' today' : ''}`;
    col.innerHTML = `
      <div class="day-header">
        <div class="day-name">${day.toLocaleDateString('en-GB', { weekday: 'short' })}</div>
        <div class="day-date">${day.getDate()}</div>
        ${durationStr ? `<div class="day-duration ${totalMins > 360 ? 'heavy' : ''}">${durationStr}</div>` : ''}
      </div>
      <div class="day-tasks" id="day-${dateStr}">
        ${dayTasks.length === 0
          ? '<div class="empty-day">—</div>'
          : dayTasks.map(t => `
            <div class="cal-task ${labelClass(t.label)}" onclick="openModal('${t.id}')">
              <div class="cal-task-title">${escHtml(t.title)}</div>
              <div class="cal-task-meta">
                ${t.duration ? `<span class="cal-tag" style="background:#e5e7eb; color:#555;">⏱ ${t.duration}m</span>` : ''}
                ${t.priority ? `<span class="cal-tag priority-${t.priority.toLowerCase()}">${t.priority}</span>` : ''}
                ${t.status === 'today' ? `<span class="cal-tag" style="background:#fed7aa; color:#9a3412;">Today</span>` : ''}
                ${t.recurring ? `<span class="cal-tag" style="background:#e0f2fe; color:#0369a1;">🔁</span>` : ''}
              </div>
            </div>
          `).join('')
        }
      </div>
    `;
    cal.appendChild(col);
  });
}

// --- MODAL ---
let selectedTaskId = null;

function openModal(id) {
  selectedTaskId = id;
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  document.getElementById('modal-title').textContent = task.title;
  document.getElementById('modal-meta').textContent =
    [task.label, task.scheduled_on].filter(Boolean).join(' · ');
  document.getElementById('modal-notes').innerHTML =
    task.notes ? `<span>Notes:</span> ${escHtml(task.notes)}` : '';
  document.getElementById('modal-duration').innerHTML =
    task.duration ? `<span>Duration:</span> ${task.duration} mins` : '';
  document.getElementById('modal-priority').innerHTML =
    task.priority ? `<span>Priority:</span> ${task.priority}` : '';
  document.getElementById('modal-status').innerHTML =
    `<span>Status:</span> ${task.status}${task.status_updated ? ' (updated ' + task.status_updated.slice(0,10) + ')' : ''}`;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function goBoard() {
  window.location.href = 'index.html';
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}
</script>
</body>
</html>
