<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>CTRL — Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #FAFAF8; color: #1C1C1A; min-height: 100vh; font-size: 13px; }

  /* LOGIN */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #1C1C1A; }
  .login-box { background: #FAFAF8; border-radius: 12px; padding: 40px; width: 340px; text-align: center; }
  .login-box h1 { font-family: 'Lora', serif; font-size: 20px; font-weight: 500; margin-bottom: 6px; }
  .login-box p { color: #999; font-size: 13px; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 10px 14px; border: 0.5px solid #E0DDD6; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; background: white; font-family: 'Inter', sans-serif; }
  .login-box input:focus { border-color: #4C3D8F; }
  .login-box button { width: 100%; padding: 10px; background: #4C3D8F; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
  .login-box button:hover { background: #3D3075; }
  .login-error { color: #E24B4A; font-size: 12px; margin-top: 8px; }
  #app { display: none; }

  /* HEADER */
  header { background: #1C1C1A; color: white; padding: 12px 24px; display: flex; flex-direction: row; align-items: center; gap: 28px; }
  .logo-mark { display: flex; flex-direction: row; align-items: center; gap: 9px; text-decoration: none; flex-shrink: 0; }
  .logo-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .logo-text { font-family: 'Lora', serif; font-size: 14px; font-weight: 500; letter-spacing: 0.5px; color: white; }
  .top-nav { display: flex; flex-direction: row; gap: 0; }
  .top-nav a { font-family: 'Lora', serif; font-size: 13px; font-weight: 500; padding: 4px 14px 4px 0; text-decoration: none; color: rgba(255,255,255,0.38); transition: color 0.15s; }
  .top-nav a:hover { color: rgba(255,255,255,0.7); }
  .top-nav .nav-active { color: rgba(255,255,255,0.9); }
  header .meta { font-size: 11px; color: rgba(255,255,255,0.3); margin-left: auto; white-space: nowrap; }

  /* BUTTONS */
  .btn { padding: 7px 14px; border-radius: 7px; border: 0.5px solid #E0DDD6; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; background: white; color: #555; }
  .btn:hover { border-color: #C5C0B8; background: #F5F4F0; }
  .btn-primary { background: #4C3D8F; color: white; border-color: #4C3D8F; }
  .btn-primary:hover { background: #3D3075; border-color: #3D3075; }
  .btn-ghost { background: transparent; border-color: transparent; color: #999; }
  .btn-ghost:hover { background: #F0EFEB; color: #555; border-color: transparent; }

  /* STATUS */
  .status-bar { padding: 6px 24px; font-size: 11px; color: #B0ADA6; background: #F4F3F0; border-top: 0.5px solid #ECEAE4; }
  .version-bar { padding: 4px 24px; font-size: 10px; color: #D0CEC8; background: #F4F3F0; text-align: right; }

  /* CALENDAR */
  .week-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: white; border-bottom: 0.5px solid #E8E5DF; }
  .week-nav h2 { font-family: 'Lora', serif; font-size: 15px; font-weight: 500; color: #1C1C1A; }
  .week-nav-buttons { display: flex; gap: 8px; align-items: center; }
  .calendar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 20px 24px; align-items: start; }
  .day-col { background: white; border-radius: 10px; border: 0.5px solid #E8E5DF; overflow: hidden; }
  .day-col.today { border-color: #4C3D8F; border-width: 1px; }
  .day-header { padding: 12px 14px 10px; border-bottom: 0.5px solid #F0EEE8; }
  .day-name { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: #B0ADA6; }
  .day-date { font-family: 'Lora', serif; font-size: 20px; font-weight: 500; color: #1C1C1A; line-height: 1.2; }
  .day-col.today .day-name { color: #4C3D8F; }
  .day-col.today .day-date { color: #4C3D8F; }
  .day-duration { font-size: 11px; color: #B0ADA6; margin-top: 2px; }
  .day-duration.heavy { color: #E24B4A; font-weight: 500; }
  .day-tasks { padding: 10px; min-height: 60px; }
  .cal-task { border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; transition: opacity 0.1s; border-left: 2px solid transparent; }
  .cal-task:hover { opacity: 0.8; }
  .cal-task-title { font-family: 'Lora', serif; font-size: 12px; font-weight: 500; line-height: 1.3; margin-bottom: 3px; color: #1C1C1A; }
  .cal-task-meta { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .cal-tag { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 400; font-family: 'Inter', sans-serif; }
  .label-bd { background: #EDF2FA; border-left-color: #4A6FA5; }
  .label-admin { background: #F4F3F0; border-left-color: #B0ADA6; }
  .label-podcast { background: #F0EDF8; border-left-color: #6B5DB8; }
  .label-client { background: #EDF6F0; border-left-color: #3B6D11; }
  .label-vb { background: #FEF6EA; border-left-color: #A07020; }
  .label-personal { background: #FDEEED; border-left-color: #E24B4A; }
  .label-dev { background: #EDF2FA; border-left-color: #4A6FA5; }
  .label-default { background: #F4F3F0; border-left-color: #E0DDD6; }
  .priority-high { background: #FDEEED; color: #A32D2D; }
  .priority-medium { background: #FEF6EA; color: #A07020; }
  .priority-low { background: #EDF6F0; color: #3B6D11; }
  .empty-day { text-align: center; color: #E0DDD6; font-size: 12px; padding: 16px 0; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(28,28,26,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #FAFAF8; border-radius: 12px; width: 480px; max-width: 95vw; padding: 24px; border: 0.5px solid #E0DDD6; }
  .modal h2 { font-family: 'Lora', serif; font-size: 16px; font-weight: 500; margin-bottom: 4px; }
  .modal .meta { font-size: 12px; color: #B0ADA6; margin-bottom: 16px; }
  .modal .detail { font-size: 13px; color: #555; margin-bottom: 8px; }
  .modal .detail span { font-weight: 500; color: #1C1C1A; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-open { padding: 8px 18px; background: #4C3D8F; color: white; border: none; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>CTRL</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="pwd-input" placeholder="Password" />
    <button onclick="tryLogin()">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
        <a href="index.html" class="logo-mark">
      <svg class="logo-icon" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="9.5" stroke="white" stroke-width="1.5" opacity="0.85"/>
        <circle cx="11" cy="11" r="3.5" fill="white" opacity="0.9"/>
        <circle cx="16.5" cy="5.5" r="2" fill="#6B5DB8"/>
      </svg>
      <span class="logo-text">CTRL</span>
    </a>
    <nav class="top-nav">
      <a href="index.html" class="nav-link">Board</a>
      <a href="plans.html" class="nav-link">Plans</a>
      <a href="calendar.html" class="nav-active">Calendar</a>
    </nav>
    <span style="font-size:12px; color:rgba(255,255,255,0.3);" id="sync-time"></span>
  </header>

  <div class="week-nav">
    <div class="week-nav-buttons">
      <button class="btn" onclick="prevWeek()">← Prev</button>
      <button class="btn btn-today" onclick="goToday()">Today</button>
      <button class="btn" onclick="nextWeek()">Next →</button>
    </div>
    <h2 id="week-label">Week of ...</h2>
    <button class="btn" onclick="loadTasks()">↻ Refresh</button>
  </div>

  <div class="calendar" id="calendar"></div>
  <div class="status-bar" id="status-bar">Loading...</div>
</div>

<!-- TASK DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <div class="meta" id="modal-meta"></div>
    <div class="detail" id="modal-notes"></div>
    <div class="detail" id="modal-duration"></div>
    <div class="detail" id="modal-priority"></div>
    <div class="detail" id="modal-status"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn-primary" onclick="goBoard()">Open in Board</button>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'timemanager2026';
const RAW_URL = '/api/data?type=tasks';

let tasks = [];
let weekOffset = 0;

// --- AUTH ---
function tryLogin() {
  const val = document.getElementById('pwd-input').value;
  if (val === PASSWORD) {
    localStorage.setItem('tm_auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadTasks();
  } else {
    document.getElementById('login-error').textContent = 'Incorrect password.';
  }
}
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
if (localStorage.getItem('tm_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadTasks();
}

// --- DATA ---
async function loadTasks() {
  setStatus('Loading...');
  try {
    const res = await fetch(RAW_URL);
    const data = await res.json();
    tasks = Array.isArray(data) ? data : (data.tasks || []);
    renderCalendar();
    document.getElementById('sync-time').textContent = 'Synced ' + new Date().toLocaleTimeString();
    setStatus(`${tasks.length} tasks loaded`);
  } catch(e) {
    setStatus('Error loading tasks: ' + e.message);
  }
}

// --- WEEK ---
function getWeekDays(offset) {
  const today = new Date();
  const day = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1) + (offset * 7));
  const days = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d);
  }
  return days;
}

function prevWeek() { weekOffset--; renderCalendar(); }
function nextWeek() { weekOffset++; renderCalendar(); }
function goToday() { weekOffset = 0; renderCalendar(); }

// --- LABEL COLOUR ---
function labelClass(label) {
  if (!label) return 'label-default';
  const l = label.toLowerCase();
  if (l.includes('business') || l.includes('bd')) return 'label-bd';
  if (l.includes('admin')) return 'label-admin';
  if (l.includes('podcast')) return 'label-podcast';
  if (l.includes('client')) return 'label-client';
  if (l.includes('vb content') || l.includes('velocity')) return 'label-vb';
  if (l.includes('personal')) return 'label-personal';
  if (l.includes('dev')) return 'label-dev';
  return 'label-default';
}

// --- RENDER ---
function renderCalendar() {
  const days = getWeekDays(weekOffset);
  const todayStr = new Date().toISOString().slice(0, 10);

  // Week label
  const from = days[0].toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const to = days[5].toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  document.getElementById('week-label').textContent = `${from} – ${to}`;

  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  days.forEach(day => {
    const dateStr = day.toISOString().slice(0, 10);
    const isToday = dateStr === todayStr;

    // Get tasks for this day — scheduled_on matches, not done
    const dayTasks = tasks.filter(t =>
      t.scheduled_on === dateStr && t.status !== 'done'
    );

    // Total duration
    const totalMins = dayTasks.reduce((sum, t) => sum + (t.duration || 0), 0);
    const durationStr = totalMins > 0
      ? totalMins >= 60
        ? `${Math.floor(totalMins/60)}h ${totalMins%60 > 0 ? totalMins%60 + 'm' : ''}`.trim()
        : `${totalMins}m`
      : '';

    const col = document.createElement('div');
    col.className = `day-col${isToday ? ' today' : ''}`;
    col.innerHTML = `
      <div class="day-header">
        <div class="day-name">${day.toLocaleDateString('en-GB', { weekday: 'short' })}</div>
        <div class="day-date">${day.getDate()}</div>
        ${durationStr ? `<div class="day-duration ${totalMins > 360 ? 'heavy' : ''}">${durationStr}</div>` : ''}
      </div>
      <div class="day-tasks" id="day-${dateStr}">
        ${dayTasks.length === 0
          ? '<div class="empty-day">—</div>'
          : dayTasks.map(t => `
            <div class="cal-task ${labelClass(t.label)}" onclick="openModal('${t.id}')">
              <div class="cal-task-title">${escHtml(t.title)}</div>
              <div class="cal-task-meta">
                ${t.duration ? `<span class="cal-tag" style="background:#e5e7eb; color:#555;">⏱ ${t.duration}m</span>` : ''}
                ${t.priority ? `<span class="cal-tag priority-${t.priority.toLowerCase()}">${t.priority}</span>` : ''}
                ${t.status === 'today' ? `<span class="cal-tag" style="background:#fed7aa; color:#9a3412;">Today</span>` : ''}
                ${t.recurring ? `<span class="cal-tag" style="background:#e0f2fe; color:#0369a1;">🔁</span>` : ''}
              </div>
            </div>
          `).join('')
        }
      </div>
    `;
    cal.appendChild(col);
  });
}

// --- MODAL ---
let selectedTaskId = null;

function openModal(id) {
  selectedTaskId = id;
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  document.getElementById('modal-title').textContent = task.title;
  document.getElementById('modal-meta').textContent =
    [task.label, task.scheduled_on].filter(Boolean).join(' · ');
  document.getElementById('modal-notes').innerHTML =
    task.notes ? `<span>Notes:</span> ${escHtml(task.notes)}` : '';
  document.getElementById('modal-duration').innerHTML =
    task.duration ? `<span>Duration:</span> ${task.duration} mins` : '';
  document.getElementById('modal-priority').innerHTML =
    task.priority ? `<span>Priority:</span> ${task.priority}` : '';
  document.getElementById('modal-status').innerHTML =
    `<span>Status:</span> ${task.status}${task.status_updated ? ' (updated ' + task.status_updated.slice(0,10) + ')' : ''}`;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function goBoard() {
  window.location.href = 'index.html';
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}
</script>
</body>
</html>
